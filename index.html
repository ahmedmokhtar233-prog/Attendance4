<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#14302b"><link rel="icon" href="icon.svg"><title>غياب الفرقة الرابعة</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--ink:#14302b;--mut:#5d7570;--line:#d6e2de;--pri:#1f7a63;--priInk:#fff;--bad:#c0392b;--late:#b7791f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c19;--card:#172a26;--ink:#e6f0ed;--mut:#92aca6;--line:#2a4640;--pri:#3bb394;--priInk:#06201a;--bad:#ef7b6e;--late:#e3b155}}
:root[data-theme="dark"]{--bg:#0f1c19;--card:#172a26;--ink:#e6f0ed;--mut:#92aca6;--line:#2a4640;--pri:#3bb394;--priInk:#06201a;--bad:#ef7b6e;--late:#e3b155}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",Tahoma,Arial,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--bg);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{font-size:17px}#sync{font-size:13px;opacity:.9}
nav{display:flex;background:var(--card);border-bottom:1px solid var(--line)}
nav button{flex:1;padding:12px 4px;border:0;background:none;color:var(--mut);font:inherit;font-weight:600;border-bottom:3px solid transparent}
nav button.on{color:var(--pri);border-color:var(--pri)}
main{max-width:720px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:2px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
button.pri{width:100%;padding:13px;border:0;border-radius:10px;background:var(--pri);color:var(--priInk);font:inherit;font-weight:700;margin-top:8px}
button.sm{padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.row{display:flex;align-items:center;gap:8px;padding:10px 6px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.row .n{flex:1}.row small{color:var(--mut)}
.st{min-width:64px;text-align:center;padding:5px 8px;border-radius:14px;font-weight:700;font-size:14px}
.P{background:var(--pri);color:var(--priInk)}.A{background:var(--bad);color:#fff}.L{background:var(--late);color:#fff}
.sum{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 12px;display:flex;justify-content:space-between;font-weight:600}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.pct{font-weight:700}.low{color:var(--bad)}.hide{display:none}.res{max-height:180px;overflow:auto}
.tag{font-size:12px;color:var(--late)}
</style></head><body>
<div id="login" style="position:fixed;inset:0;background:var(--bg);z-index:50;padding:24px;overflow:auto"><div class="card" style="max-width:380px;margin:12vh auto 0"><h2 style="margin-top:0">تسجيل الدخول</h2><label>الإيميل</label><input id="le" type="email" autocomplete="username" dir="ltr"><label style="margin-top:8px">كلمة المرور</label><input id="lp" type="password" autocomplete="current-password" dir="ltr"><div id="lerr" class="tag" style="margin-top:6px"></div><button class="pri" id="lgo">دخول</button><small style="color:var(--mut)">أول دخول يحتاج إنترنت، وبعدها يفضل الحساب شغال أوفلاين.</small></div></div>
<header><b>غياب الفرقة الرابعة</b><span><span id="sync"></span> <button class="sm" id="lout" style="padding:3px 8px">خروج</button></span></header>
<nav><button data-t="take" class="on">تحضير</button><button data-t="log">السجل</button><button data-t="day">اليوم</button><button data-t="stats">الإحصائيات</button></nav>
<main>
<section id="take">
 <div class="card"><div class="grid">
  <div><label>اسم الدكتور</label><input id="doc" placeholder="الاسم"></div>
  <div><label>الموديول</label><input id="mod" list="mods" placeholder="GIT"><datalist id="mods"></datalist></div>
  <div><label>النوع</label><select id="typ"><option>راوند</option><option>محاضرة</option></select></div>
  <div><label>التاريخ</label><input id="dt" type="date"></div>
 </div><div style="margin-top:8px"><label>المجموعة</label><select id="grp"></select></div></div>
 <div class="card"><div id="list"></div></div>
 <div class="card"><label>طالب من مجموعة تانية حضر معاك</label><input id="q" placeholder="ابحث بالاسم أو الكود"><div id="res" class="res"></div>
  <button class="sm" id="addBtn" style="margin-top:8px">+ إضافة طالب جديد للمجموعة</button>
  <div id="addBox" class="hide" style="margin-top:8px"><input id="an" placeholder="اسم الطالب"><input id="ac" placeholder="الكود (اختياري)" style="margin-top:6px"><button class="pri" id="aok">حفظ الطالب</button></div></div>
 <div class="sum"><span id="cnt"></span><span id="edit"></span></div>
 <button class="pri" id="save">حفظ التحضير</button>
</section>
<section id="log" class="hide"><div class="card" style="display:flex;gap:8px"><button class="sm" id="bx">نسخة احتياطية</button><button class="sm" id="bi">استيراد نسخة</button><button class="sm" id="ri">استيراد قائمة الطلاب</button><input type="file" id="rf" accept=".json" class="hide"><input type="file" id="bf" accept=".json" class="hide"></div><div id="logl"></div></section>
<section id="day" class="hide"><div class="card"><label>التاريخ</label><input id="dd" type="date"><div id="dsum" style="margin-top:8px;font-weight:600"></div><small id="dsync" class="tag"></small><br><button class="sm" id="dcsv" style="margin-top:8px">تصدير تقرير اليوم CSV</button></div><div id="dl"></div></section>
<section id="stats" class="hide">
 <div class="card"><div class="grid"><div><label>الموديول</label><select id="sm"></select></div><div><label>المجموعة</label><select id="sg"></select></div></div>
  <button class="sm" id="csv" style="margin-top:8px">تصدير CSV</button></div>
 <div class="card scroll"><table><thead><tr><th>الطالب</th><th>المجموعة</th><th>حضر</th><th>من</th><th>%</th></tr></thead><tbody id="sb"></tbody></table></div>
</section>
</main>
<script src="fb.js"></script>
<script>
let ST=[];
const $=s=>document.querySelector(s),LS='att_v1';
let lastPull=0;let L={doctor:'',sessions:{},extra:[],del:[]},R={sessions:{},extra:{},pending:{}},cur=null;
try{L=Object.assign(L,JSON.parse(localStorage.getItem(LS)||'{}'))}catch(e){}
const persist=()=>{try{localStorage.setItem(LS,JSON.stringify(L))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const allStudents=()=>{const m={};ST.forEach(s=>m[s[1]]={id:s[1],g:s[0],n:s[2]});[...L.extra,...Object.values(R.extra)].forEach(s=>m[s.id]=s);return Object.values(m)};
const allSessions=()=>{const m=Object.assign({},R.sessions,L.sessions);(L.del||[]).forEach(i=>delete m[i]);return m};
const groups=[...Array(12)].map((_,i)=>'A'+(i+1)).concat([...Array(12)].map((_,i)=>'B'+(i+1)));
const lab={P:'حاضر',A:'غايب',L:'متأخر'},nxt={P:'A',A:'L',L:'P'};
$('#grp').innerHTML=groups.map(g=>`<option>${g}</option>`).join('');
$('#dt').value=new Date().toISOString().slice(0,10);$('#doc').value=L.doctor||'';
function newSession(){cur={id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()),marks:{},extra:[]};}
newSession();
function render(){
 const g=$('#grp').value,ss=allStudents().filter(s=>s.g===g);
 ss.forEach(s=>{if(!cur.marks[s.id])cur.marks[s.id]='P'});
 const ids=[...ss.map(s=>s.id),...cur.extra.filter(i=>!ss.find(s=>s.id===i))],by={};allStudents().forEach(s=>by[s.id]=s);
 $('#list').innerHTML=!ST.length?'<small>لا توجد قائمة طلاب بعد. من تبويب السجل اضغط "استيراد قائمة الطلاب" واختار roster.json.</small>':ids.map(i=>{const s=by[i];if(!s)return'';return`<div class="row" data-i="${esc(i)}"><span class="n">${esc(s.n)}${s.g!==g?` <small class="tag">من ${s.g}</small>`:''}</span><span class="st ${cur.marks[i]}">${lab[cur.marks[i]]}</span></div>`}).join('')||'<small>لا يوجد طلاب</small>';
 const v=Object.values(cur.marks).filter((x,k,a)=>1);const ks=ids.map(i=>cur.marks[i]);
 $('#cnt').textContent=`حاضر ${ks.filter(x=>x!=='A').length} · غايب ${ks.filter(x=>x==='A').length}`;
 $('#edit').textContent=allSessions()[cur.id]?'تعديل تحضير محفوظ':'';
}
$('#list').onclick=e=>{const r=e.target.closest('.row');if(!r)return;const i=r.dataset.i;cur.marks[i]=nxt[cur.marks[i]];render()};
$('#grp').onchange=()=>{newSession();render()};
$('#q').oninput=()=>{const q=$('#q').value.trim();if(q.length<2){$('#res').innerHTML='';return}
 const g=$('#grp').value;$('#res').innerHTML=allStudents().filter(s=>s.g!==g&&(s.n.includes(q)||String(s.id).includes(q))).slice(0,15).map(s=>`<div class="row" data-a="${esc(s.id)}"><span class="n">${esc(s.n)}</span><small>${s.g}</small></div>`).join('')};
$('#res').onclick=e=>{const r=e.target.closest('[data-a]');if(!r)return;const i=r.dataset.a;if(!cur.extra.includes(i))cur.extra.push(i);cur.marks[i]='P';$('#q').value='';$('#res').innerHTML='';render()};
$('#addBtn').onclick=()=>$('#addBox').classList.toggle('hide');
$('#aok').onclick=()=>{const n=$('#an').value.trim();if(!n)return alert('اكتب اسم الطالب');const s={id:$('#ac').value.trim()||'x'+Date.now(),n,g:$('#grp').value};FB.put('students',s.id,s);$('#an').value=$('#ac').value='';$('#addBox').classList.add('hide');sync();render()};
$('#save').onclick=()=>{const doc=$('#doc').value.trim(),mod=$('#mod').value.trim();if(!doc||!mod)return alert('اكتب اسم الدكتور والموديول');
 const g=$('#grp').value,marks={};allStudents().filter(s=>s.g===g).forEach(s=>marks[s.id]=cur.marks[s.id]||'P');cur.extra.forEach(i=>marks[i]=cur.marks[i]);
 L.doctor=doc;persist();FB.put('sessions',cur.id,{id:cur.id,doctor:doc,module:mod,type:$('#typ').value,date:$('#dt').value,group:g,marks,by:FB.email(),at:Date.now()});
 newSession();render();status();sync();fillMods();alert('تم الحفظ، وهيترفع تلقائيًا لما يبقى فيه نت')};
function fillMods(){const m=[...new Set(Object.values(allSessions()).map(s=>s.module))];
 $('#mods').innerHTML=['GIT','Nephrology','Cardiology','Chest','Endocrinology','Hematology','Rheumatology','Neurology'].concat(m).map(x=>`<option>${esc(x)}</option>`).join('');
 const o=$('#sm').value;$('#sm').innerHTML=m.map(x=>`<option>${esc(x)}</option>`).join('');if(m.includes(o))$('#sm').value=o;
 $('#sg').innerHTML='<option value="">كل المجموعات</option>'+groups.map(g=>`<option>${g}</option>`).join('')}
function logView(){const a=Object.values(allSessions()).sort((x,y)=>(y.date||'').localeCompare(x.date||'')||y.at-x.at);
 $('#logl').innerHTML=a.map(s=>{const p=Object.values(s.marks).filter(x=>x!=='A').length;return`<div class="card"><b>${esc(s.module)}</b> · ${esc(s.type)} · ${s.group}<br><small>${s.date} — د. ${esc(s.doctor)} — حضر ${p} من ${Object.keys(s.marks).length}${R.pending[s.id]?' <span class="tag">لم يُرفع</span>':''}</small><div style="margin-top:6px;display:flex;gap:8px"><button class="sm" data-e="${s.id}">تعديل</button><button class="sm" data-d="${s.id}" style="color:var(--bad)">حذف</button></div></div>`}).join('')||'<div class="card">لا توجد تحضيرات بعد</div>'}
$('#logl').onclick=e=>{const x=e.target.closest('[data-d]');if(x){const id=x.dataset.d,s=allSessions()[id];if(!s||!confirm('حذف تحضير '+s.module+' - '+s.group+' بتاريخ '+s.date+'؟'))return;
 FB.del('sessions',id);delete R.sessions[id];if(cur.id===id)newSession();logView();render();return}
 const b=e.target.closest('[data-e]');if(!b)return;const s=allSessions()[b.dataset.e];cur={id:s.id,marks:Object.assign({},s.marks),extra:Object.keys(s.marks).filter(i=>!(ST.find(x=>x[1]==i&&x[0]===s.group)))};
 $('#doc').value=s.doctor;$('#mod').value=s.module;$('#typ').value=s.type;$('#dt').value=s.date;$('#grp').value=s.group;tab('take');render()};
function stats(){const mod=$('#sm').value,g=$('#sg').value,S=Object.values(allSessions()).filter(s=>s.module===mod);
 const rows=allStudents().filter(s=>!g||s.g===g).map(s=>{const att=S.filter(x=>x.marks[s.id]&&x.marks[s.id]!=='A').length;
  const tot=Math.max(att,new Set(S.filter(x=>x.group===s.g).map(x=>x.date+x.type)).size);return{s,att,tot,p:tot?Math.round(att*100/tot):null}});
 rows.sort((a,b)=>(a.p??101)-(b.p??101));window._rows=rows;
 $('#sb').innerHTML=rows.map(r=>`<tr><td>${esc(r.s.n)}</td><td>${r.s.g}</td><td>${r.att}</td><td>${r.tot}</td><td class="pct ${r.p!==null&&r.p<75?'low':''}">${r.p===null?'-':r.p+'%'}</td></tr>`).join('')}
$('#sm').onchange=$('#sg').onchange=stats;
function dl(n,x,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([x],{type:m}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
$('#csv').onclick=()=>dl('attendance-'+$('#sm').value+'.csv','\ufeffالطالب,المجموعة,حضر,من,نسبة\n'+(window._rows||[]).map(r=>[`"${r.s.n}"`,r.s.g,r.att,r.tot,r.p===null?'':r.p].join(',')).join('\n'),'text/csv');
$('#bx').onclick=()=>dl('attendance-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({sessions:allSessions(),extra:Object.values(R.extra)}),'application/json');
$('#ri').onclick=()=>$('#rf').click();
$('#rf').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());let n=0;Object.entries(j).forEach(([g,a])=>{FB.put('roster',g,{students:a.map(s=>({i:s[0],n:s[1]}))});n+=a.length});alert('تم رفع قائمة '+n+' طالب')}catch(x){alert('الملف غير صالح')}e.target.value=''};
$('#bi').onclick=()=>$('#bf').click();
$('#bf').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());let n=0;Object.values(j.sessions||{}).forEach(s=>{const o=allSessions()[s.id];if(!o||(s.at||0)>(o.at||0)){FB.put('sessions',s.id,s);n++}});(j.extra||[]).forEach(s=>{if(!R.extra[s.id])FB.put('students',s.id,s)});alert('تم استيراد '+n+' تحضير')}catch(x){alert('الملف غير صالح')}e.target.value=''};
function dayView(){const d=$('#dd').value,S=Object.values(allSessions()).filter(s=>s.date===d),by={};allStudents().forEach(s=>by[s.id]=s);let done=0,p=0,a=0;
 $('#dl').innerHTML=groups.map(g=>{const ss=S.filter(s=>s.group===g);if(!ss.length)return`<div class="card"><b>${g}</b> <span class="tag">لم يُسجَّل غياب</span></div>`;done++;
  return`<div class="card"><b>${g}</b>`+ss.map(s=>{const m=Object.entries(s.marks),ab=m.filter(x=>x[1]==='A'),pr=m.length-ab.length;p+=pr;a+=ab.length;
   return`<div style="margin-top:6px">${esc(s.module)} · ${esc(s.type)} · د. ${esc(s.doctor)}<br>حضر ${pr} · غاب ${ab.length}${ab.length?`<details><summary>الغائبون</summary>${ab.map(x=>esc(by[x[0]]?by[x[0]].n:x[0])).join('<br>')}</details>`:''}</div>`}).join('')+'</div>'}).join('');
 $('#dsum').textContent=`تم تسجيل ${done} من 24 مجموعة · حضور ${p} · غياب ${a}`;
 $('#dsync').textContent=lastPull?'آخر تحديث: '+new Date(lastPull).toLocaleTimeString('ar-EG')+(navigator.onLine?'':' (أوفلاين)'):'بانتظار البيانات'}
$('#dd').value=new Date().toISOString().slice(0,10);$('#dd').onchange=dayView;
$('#dcsv').onclick=()=>{const d=$('#dd').value,by={};allStudents().forEach(s=>by[s.id]=s);const rows=[];
 Object.values(allSessions()).filter(s=>s.date===d).forEach(s=>Object.entries(s.marks).forEach(([i,v])=>rows.push([d,s.group,s.module,s.type,`"${s.doctor}"`,i,`"${by[i]?by[i].n:''}"`,by[i]?by[i].g:'',lab[v]].join(','))));
 dl('daily-'+d+'.csv','\ufeffالتاريخ,المجموعة,الموديول,النوع,الدكتور,الكود,الطالب,مجموعته الأصلية,الحالة\n'+rows.join('\n'),'text/csv')};
function tab(t){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));['take','log','stats','day'].forEach(x=>$('#'+x).classList.toggle('hide',x!==t));if(t==='log')logView();if(t==='day')dayView();if(t==='stats'){fillMods();stats()}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
function status(){const n=Object.keys(R.pending).filter(k=>R.pending[k]).length;$('#sync').textContent=(navigator.onLine?'متصل':'أوفلاين')+(n?' · '+n+' لم يُرفع':' · الكل مرفوع')}
function sync(){status()}
let unsub=[];
function dayRefresh(){fillMods();render();if(!$('#day').classList.contains('hide'))dayView();if(!$('#log').classList.contains('hide'))logView();status()}
FB.onUser(u=>{$('#login').classList.toggle('hide',!!u);unsub.forEach(f=>f&&f());unsub=[];
 if(u){unsub.push(FB.watch('sessions',(m,p)=>{R.sessions=m;R.pending=p;lastPull=Date.now();dayRefresh()}));unsub.push(FB.watch('students',(m)=>{R.extra=m;dayRefresh()}));unsub.push(FB.watch('roster',(m)=>{ST=[];Object.entries(m).forEach(([g,d])=>(d.students||[]).forEach(s=>ST.push(Array.isArray(s)?[g,s[0],s[1]]:[g,s.i,s.n])));dayRefresh()}))}else{R.sessions={};R.extra={};R.pending={}}});
$('#lgo').onclick=async()=>{$('#lerr').textContent='';try{await FB.login($('#le').value.trim(),$('#lp').value)}catch(e){$('#lerr').textContent=navigator.onLine?'الإيميل أو كلمة المرور غير صحيحة':'محتاج إنترنت لأول دخول'}};
$('#lout').onclick=()=>{if(confirm('تسجيل الخروج؟'))FB.logout()};
window.addEventListener('offline',status);
window.addEventListener('online',sync);if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});fillMods();render();status();
</script></body></html>
