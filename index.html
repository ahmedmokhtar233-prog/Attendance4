<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#14302b"><link rel="icon" href="icon.svg"><title>غياب الفرقة الرابعة</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--ink:#14302b;--mut:#5d7570;--line:#d6e2de;--pri:#1f7a63;--priInk:#fff;--bad:#c0392b;--late:#b7791f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c19;--card:#172a26;--ink:#e6f0ed;--mut:#92aca6;--line:#2a4640;--pri:#3bb394;--priInk:#06201a;--bad:#ef7b6e;--late:#e3b155}}
:root[data-theme="dark"]{--bg:#0f1c19;--card:#172a26;--ink:#e6f0ed;--mut:#92aca6;--line:#2a4640;--pri:#3bb394;--priInk:#06201a;--bad:#ef7b6e;--late:#e3b155}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",Tahoma,Arial,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--bg);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{font-size:17px}#sync{font-size:13px;opacity:.9}
nav{display:flex;background:var(--card);border-bottom:1px solid var(--line)}
nav button{flex:1;padding:12px 4px;border:0;background:none;color:var(--mut);font:inherit;font-weight:600;border-bottom:3px solid transparent}
nav button.on{color:var(--pri);border-color:var(--pri)}
main{max-width:720px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:2px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
button.pri{width:100%;padding:13px;border:0;border-radius:10px;background:var(--pri);color:var(--priInk);font:inherit;font-weight:700;margin-top:8px}
button.sm{padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.row{display:flex;align-items:center;gap:8px;padding:10px 6px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.row .n{flex:1}.row small{color:var(--mut)}
.st{min-width:64px;text-align:center;padding:5px 8px;border-radius:14px;font-weight:700;font-size:14px}
.P{background:var(--pri);color:var(--priInk)}.A{background:var(--bad);color:#fff}.L{background:var(--late);color:#fff}
.sum{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 12px;display:flex;justify-content:space-between;font-weight:600}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.pct{font-weight:700}.low{color:var(--bad)}.hide{display:none}.res{max-height:180px;overflow:auto}
.tag{font-size:12px;color:var(--late)}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.chip{padding:10px 14px;border:1px solid var(--line);border-radius:20px;background:var(--bg);color:var(--ink);font:inherit;touch-action:manipulation}.chip.on{background:var(--pri);color:var(--priInk);border-color:var(--pri);font-weight:700}
.X{background:var(--line);color:var(--mut);font-size:12px;min-width:0}.row.blk{cursor:default;opacity:.8}
</style></head><body>
<div id="login" style="position:fixed;inset:0;background:var(--bg);z-index:50;padding:24px;overflow:auto"><div class="card" style="max-width:380px;margin:12vh auto 0"><h2 style="margin-top:0">تسجيل الدخول</h2><label>الإيميل</label><input id="le" type="email" autocomplete="username" dir="ltr"><label style="margin-top:8px">كلمة المرور</label><input id="lp" type="password" autocomplete="current-password" dir="ltr"><div id="lerr" class="tag" style="margin-top:6px"></div><button class="pri" id="lgo">دخول</button><small style="color:var(--mut)">أول دخول يحتاج إنترنت، وبعدها يفضل الحساب شغال أوفلاين.</small></div></div>
<header><b>غياب الفرقة الرابعة</b> <small id="ver" style="opacity:.55;font-size:10px"></small><span><span id="sync"></span> <button class="sm" id="lout" style="padding:3px 8px">خروج</button></span></header>
<nav><button data-t="take" class="on">تحضير</button><button data-t="log">السجل</button><button data-t="day">اليوم</button><button data-t="stats">الإحصائيات</button></nav>
<main>
<section id="take">
 <div id="mine"></div>
 <div class="card"><div class="grid">
  <div><label>اسم الدكتور</label><input id="doc" placeholder="الاسم"></div>
  <div><label>موديول آخر (اختياري)</label><input id="mod" placeholder="اكتب الاسم"></div>
  <div><label>النوع</label><select id="typ"><option>راوند</option><option>محاضرة</option></select></div>
  <div><label>التاريخ</label><input id="dt" type="date"></div>
 </div><div style="margin-top:10px"><label>الموديول (اضغط للاختيار)</label><div id="chips" class="chips"></div></div><div style="margin-top:10px"><label>المجموعة</label><select id="grp"></select></div></div>
 <div class="card"><div id="list"></div></div>
 <div class="card"><label>طالب من مجموعة تانية حضر معاك</label><input id="q" placeholder="ابحث بالاسم أو الكود"><div id="res" class="res"></div>
  <button class="sm" id="addBtn" style="margin-top:8px">+ إضافة طالب جديد للمجموعة</button>
  <div id="addBox" class="hide" style="margin-top:8px"><input id="an" placeholder="اسم الطالب"><input id="ac" placeholder="الكود (اختياري)" style="margin-top:6px"><button class="pri" id="aok">حفظ الطالب</button></div></div>
 <div class="sum"><span id="cnt"></span><span id="edit"></span></div>
 <button class="pri" id="save">حفظ التحضير</button>
 <button class="sm hide" id="cedit" style="width:100%;margin-top:8px">إلغاء التعديل</button>
</section>
<section id="log" class="hide"><div class="card" style="display:flex;gap:8px"><button class="sm" id="bx">نسخة احتياطية</button><button class="sm" id="bi">استيراد نسخة</button><button class="sm" id="ri">استيراد قائمة الطلاب</button><input type="file" id="rf" accept=".json" class="hide"><input type="file" id="bf" accept=".json" class="hide"></div><div id="blk"></div><div id="logl"></div></section>
<section id="day" class="hide"><div class="card"><label>التاريخ</label><input id="dd" type="date"><div id="dsum" style="margin-top:8px;font-weight:600"></div><small id="dsync" class="tag"></small><br><div style="margin-top:8px"><label>تصدير لفترة: إلى تاريخ (اتركه فاضي لتصدير اليوم المختار فقط)</label><input id="dd2" type="date"></div><div style="margin-top:8px"><label>محتوى ملف التصدير</label><select id="dflt"><option value="">الحضور والغياب</option><option value="p">الحضور فقط</option><option value="a">الغياب فقط</option></select></div><button class="sm" id="dcsv" style="margin-top:8px">تصدير تقرير اليوم CSV</button></div><div id="dl"></div></section>
<section id="stats" class="hide">
 <div class="card"><div class="grid"><div><label>الموديول</label><select id="sm"></select></div><div><label>المجموعة</label><select id="sg"></select></div></div>
  <div class="grid" style="margin-top:8px"><div><label>نوع الجلسة</label><select id="stt"><option value="r">راوند</option><option value="l">محاضرة</option><option value="a">الكل</option></select></div><div><label>إجمالي الجلسات للموديول</label><div style="display:flex;gap:6px"><input id="tr" type="number" min="0" placeholder="روندات"><input id="tl" type="number" min="0" placeholder="محاضرات"></div></div></div>
  <button class="sm" id="tsv" style="margin-top:8px">حفظ الإجمالي</button> <button class="sm" id="csv" style="margin-top:8px">تصدير CSV</button><div><small id="thint" class="tag"></small></div></div>
 <div class="card scroll"><table><thead><tr><th>الطالب</th><th>المجموعة</th><th>حضر</th><th>من</th><th>%</th></tr></thead><tbody id="sb"></tbody></table></div>
</section>
</main>
<script src="fb.js"></script>
<script>
let ST=[],RO={},SET=[];
const $=s=>document.querySelector(s),LS='att_v1';
let lastPull=0;let L={doctor:'',sessions:{},extra:[],del:[]},R={sessions:{},extra:{},pending:{}},cur=null;
try{L=Object.assign(L,JSON.parse(localStorage.getItem(LS)||'{}'))}catch(e){}
L.mine=L.mine||{};
const persist=()=>{try{localStorage.setItem(LS,JSON.stringify(L))}catch(e){}};
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const allStudents=()=>{const m={};ST.forEach(s=>m[s[1]]={id:s[1],g:s[0],n:s[2],b:s[3],f:s[4]});[...L.extra,...Object.values(R.extra)].forEach(s=>m[s.id]=s);return Object.values(m)};
const allSessions=()=>{const m=Object.assign({},R.sessions,L.sessions);(L.del||[]).forEach(i=>delete m[i]);return m};
let groups=[];
const nk=g=>{const m=/^([A-Za-z]+)(\d+)$/.exec(g);return m?[0,m[1],+m[2]]:[1,g,0]};
function setGroups(){const gs=[...new Set(allStudents().map(s=>s.g))].sort((a,b)=>{const x=nk(a),y=nk(b);return x[0]-y[0]||(x[1]<y[1]?-1:x[1]>y[1]?1:0)||x[2]-y[2]});
 if(gs.join('|')===groups.join('|'))return;const c=$('#grp').value;groups=gs;$('#grp').innerHTML=groups.map(g=>`<option>${esc(g)}</option>`).join('');if(groups.includes(c))$('#grp').value=c}
const lab={P:'حاضر',A:'غايب',L:'متأخر'},nxt={P:'A',A:'L',L:'P'};
$('#dt').value=today();$('#doc').value=L.doctor||'';
function newSession(){cur={id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()),marks:{},extra:[]};}
newSession();
function render(){
 const g=$('#grp').value,ss=allStudents().filter(s=>s.g===g),act=ss.filter(s=>!s.b),blk=ss.filter(s=>s.b);
 act.forEach(s=>{if(!cur.marks[s.id])cur.marks[s.id]='P'});
 const ids=[...act.map(s=>s.id),...cur.extra.filter(i=>!act.find(s=>s.id===i))],by={};allStudents().forEach(s=>by[s.id]=s);
 $('#list').innerHTML=!ST.length?'<small>لا توجد قائمة طلاب بعد. من تبويب السجل اضغط "استيراد قائمة الطلاب" واختار roster.json.</small>':(ids.map(i=>{const s=by[i];if(!s)return'';return`<div class="row" data-i="${esc(i)}"><span class="n">${esc(s.n)}${s.g!==g?` <small class="tag">من ${esc(s.g)}</small>`:''}</span><span class="st ${cur.marks[i]}">${lab[cur.marks[i]]}</span></div>`}).join('')+blk.map(s=>`<div class="row blk"><span class="n">${esc(s.n)}</span><span class="st X">محجوب من الغياب</span></div>`).join('')||'<small>لا يوجد طلاب</small>');
 const ks=ids.map(i=>cur.marks[i]);
 $('#cnt').textContent=`حاضر ${ks.filter(x=>x!=='A').length} · غايب ${ks.filter(x=>x==='A').length}`+(blk.length?` · محجوب ${blk.length}`:'');
 $('#edit').textContent=cur.orig?'تعديل تحضير محفوظ':'';
}
$('#list').onclick=e=>{const r=e.target.closest('.row');if(!r||r.classList.contains('blk')||!r.dataset.i)return;const i=r.dataset.i;cur.marks[i]=nxt[cur.marks[i]];render()};
$('#grp').onchange=()=>{newSession();render()};
$('#q').oninput=()=>{const q=$('#q').value.trim();if(q.length<2){$('#res').innerHTML='';return}
 const g=$('#grp').value;$('#res').innerHTML=allStudents().filter(s=>s.g!==g&&!s.b&&(s.n.includes(q)||String(s.id).includes(q))).slice(0,15).map(s=>`<div class="row" data-a="${esc(s.id)}"><span class="n">${esc(s.n)}</span><small>${s.g}</small></div>`).join('')};
$('#res').onclick=e=>{const r=e.target.closest('[data-a]');if(!r)return;const i=r.dataset.a;if(!cur.extra.includes(i))cur.extra.push(i);cur.marks[i]='P';$('#q').value='';$('#res').innerHTML='';render()};
$('#addBtn').onclick=()=>$('#addBox').classList.toggle('hide');
$('#aok').onclick=()=>{const n=$('#an').value.trim();if(!n)return alert('اكتب اسم الطالب');const s={id:$('#ac').value.trim()||'x'+Date.now(),n,g:$('#grp').value};FB.put('students',s.id,s);track();$('#an').value=$('#ac').value='';$('#addBox').classList.add('hide');sync();render()};
const WIN=3*3600*1000;
function lockEdit(on){$('#cedit').classList.toggle('hide',!on);$('#grp').disabled=on;
 ['#doc','#mod','#typ','#dt'].forEach(k=>$(k).disabled=on&&!admin);$('#chips').style.pointerEvents=(on&&!admin)?'none':''}
function openEdit(s){cur={id:s.id,marks:Object.assign({},s.marks),extra:Object.keys(s.marks).filter(i=>!allStudents().find(x=>String(x.id)===String(i)&&x.g===s.group)),orig:s};
 $('#doc').value=s.doctor;$('#mod').value=s.module;chips();$('#typ').value=s.type;$('#dt').value=s.date;$('#grp').value=s.group;tab('take');lockEdit(true);render()}
$('#cedit').onclick=()=>{newSession();lockEdit(false);render()};
$('#save').onclick=()=>{const doc=$('#doc').value.trim(),mod=$('#mod').value.trim();if(!doc||!mod)return alert('اكتب اسم الدكتور والموديول');
 const o=cur.orig,now=Date.now();
 if(o&&!admin&&now-o.at>=WIN){alert('انتهت مدة التعديل (3 ساعات). اطلب من المدير تعديل التحضير.');newSession();lockEdit(false);render();mineView();return}
 const g=$('#grp').value,marks={};allStudents().filter(s=>s.g===g&&!s.b).forEach(s=>marks[s.id]=cur.marks[s.id]||'P');cur.extra.forEach(i=>marks[i]=cur.marks[i]);
 const f={doctor:doc,module:mod,type:$('#typ').value,date:$('#dt').value,group:g,marks};
 const ses=o?Object.assign({},o,f,{upd:now}):Object.assign({id:cur.id,by:FB.email(),at:now},f);
 L.doctor=doc;if(ses.by===FB.email())L.mine[ses.id]=ses;persist();FB.put('sessions',ses.id,ses);track();
 newSession();lockEdit(false);render();status();sync();fillMods();mineView();alert('تم الحفظ، وهيترفع تلقائيًا لما يبقى فيه نت')};
function mineView(){const now=Date.now();Object.keys(L.mine).forEach(k=>{if(now-L.mine[k].at>86400000)delete L.mine[k]});persist();
 const a=Object.values(L.mine).filter(s=>now-s.at<WIN).sort((x,y)=>y.at-x.at);
 $('#mine').innerHTML=a.length?`<div class="card"><b>تحضيراتي (التعديل متاح 3 ساعات من أول حفظ)</b>`+a.map(s=>{const m=Math.max(0,Math.ceil((s.at+WIN-now)/60000));return`<div class="row" style="cursor:default"><span class="n">${esc(s.group)} · ${esc(s.module)} · ${esc(s.type)}<br><small>باقي ${Math.floor(m/60)}س ${m%60}د</small></span><button class="sm" data-me="${esc(s.id)}">تعديل</button></div>`}).join('')+'</div>':''}
$('#mine').onclick=e=>{const b=e.target.closest('[data-me]');if(!b)return;const s=L.mine[b.dataset.me];if(!s)return;if(!admin&&Date.now()-s.at>=WIN)return alert('انتهت مدة التعديل (3 ساعات)');openEdit(s)};
const BASE_MODS=['GIT','Nephrology','Cardiology','Chest','Endocrinology','Hematology','Rheumatology','Neurology'];
function chips(){const c=$('#mod').value.trim(),m=Object.values(allSessions()).map(s=>s.module),all=[...new Set(BASE_MODS.concat(m))];
 $('#chips').innerHTML=all.map(x=>`<button type="button" class="chip${x===c?' on':''}" data-m="${esc(x)}">${esc(x)}</button>`).join('')}
$('#chips').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;$('#mod').value=b.dataset.m;chips()};
$('#mod').oninput=chips;
function fillMods(){setGroups();const m=[...new Set(BASE_MODS.concat(Object.values(allSessions()).map(s=>s.module),SET.map(x=>x.m)))];chips();
 const o=$('#sm').value;$('#sm').innerHTML=m.map(x=>`<option>${esc(x)}</option>`).join('');if(m.includes(o))$('#sm').value=o;
 const og=$('#sg').value;$('#sg').innerHTML='<option value="">كل المجموعات</option>'+groups.map(g=>`<option>${esc(g)}</option>`).join('');if(groups.includes(og))$('#sg').value=og}
function blkView(){const a=allStudents().filter(s=>s.b);$('#blk').innerHTML=a.length?`<div class="card"><b>محجوبون من الغياب (${a.length})</b><div style="margin-top:6px">${a.map(s=>`<div class="row" style="cursor:default"><span class="n">${esc(s.n)} <small>${esc(s.g)}</small></span><button class="sm" data-u="${esc(s.id)}">فك الحجب</button></div>`).join('')}</div></div>`:''}
$('#blk').onclick=e=>{const b=e.target.closest('[data-u]');if(!b)return;const id=b.dataset.u,s=allStudents().find(x=>String(x.id)===id);if(!s)return;
 const d=prompt('فك الحجب عن '+s.n+'\nتاريخ بداية احتساب الغياب (سنة-شهر-يوم):',today());if(!d)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(d.trim()))return alert('اكتب التاريخ بالشكل 2026-11-01');
 const arr=((RO[s.g]||{}).students||[]).map(x=>String(x.i)===id?{i:x.i,n:x.n,f:d.trim()}:x);FB.put('roster',s.g,{students:arr});track()};
function logView(){blkView();const a=Object.values(allSessions()).sort((x,y)=>(y.date||'').localeCompare(x.date||'')||y.at-x.at);
 $('#logl').innerHTML=a.map(s=>{const p=Object.values(s.marks).filter(x=>x!=='A').length;return`<div class="card"><b>${esc(s.module)}</b> · ${esc(s.type)} · ${s.group}<br><small>${s.date} — د. ${esc(s.doctor)} — حضر ${p} من ${Object.keys(s.marks).length}${R.pending[s.id]?' <span class="tag">لم يُرفع</span>':''}</small><div style="margin-top:6px;display:flex;gap:8px"><button class="sm" data-e="${s.id}">تعديل</button><button class="sm" data-d="${s.id}" style="color:var(--bad)">حذف</button></div></div>`}).join('')||'<div class="card">لا توجد تحضيرات بعد</div>'}
$('#logl').onclick=e=>{const x=e.target.closest('[data-d]');if(x){const id=x.dataset.d,s=allSessions()[id];if(!s||!confirm('حذف تحضير '+s.module+' - '+s.group+' بتاريخ '+s.date+'؟'))return;
 FB.del('sessions',id);delete R.sessions[id];if(cur.id===id)newSession();logView();render();return}
 const b=e.target.closest('[data-e]');if(!b)return;const s=allSessions()[b.dataset.e];if(s)openEdit(s)};
function cfgFill(){const c=SET.find(x=>x.m===$('#sm').value)||{};$('#tr').value=c.r||'';$('#tl').value=c.l||''}
function stats(){const mod=$('#sm').value,g=$('#sg').value,ty=$('#stt').value,cfg=SET.find(x=>x.m===mod)||{},
 want=ty==='r'?['راوند']:ty==='l'?['محاضرة']:['راوند','محاضرة'],S=Object.values(allSessions()).filter(s=>s.module===mod&&want.includes(s.type)),
 T=ty==='r'?cfg.r:ty==='l'?cfg.l:(cfg.r&&cfg.l?cfg.r+cfg.l:0);
 $('#thint').textContent=T?'':'لم تُحدَّد إجمالي الجلسات لهذا الموديول، فالنسبة مؤقتة ومحسوبة من الجلسات المسجلة لمجموعة كل طالب (قد تكون غير دقيقة مع تجميع المجموعات).';
 const rows=allStudents().filter(s=>!g||s.g===g).map(s=>{if(s.b)return{s,att:0,tot:0,p:null,blk:true};const att=S.filter(x=>x.marks[s.id]&&x.marks[s.id]!=='A').length;
  const own=new Set(S.filter(x=>x.group===s.g&&(!s.f||x.date>=s.f)).map(x=>x.date+x.type)).size,tot=Math.max(att,(T&&!s.f)?T:own);return{s,att,tot,p:tot?Math.round(att*100/tot):null}});
 rows.sort((a,b)=>(a.blk?1:0)-(b.blk?1:0)||(a.p??101)-(b.p??101));window._rows=rows;
 $('#sb').innerHTML=rows.map(r=>r.blk?`<tr><td>${esc(r.s.n)}</td><td>${esc(r.s.g)}</td><td>-</td><td>-</td><td class="pct">محجوب</td></tr>`:`<tr><td>${esc(r.s.n)}</td><td>${esc(r.s.g)}</td><td>${r.att}</td><td>${r.tot}</td><td class="pct ${r.p!==null&&r.p<75?'low':''}">${r.p===null?'-':r.p+'%'}</td></tr>`).join('')}
$('#sm').onchange=()=>{cfgFill();stats()};$('#sg').onchange=$('#stt').onchange=stats;
$('#tsv').onclick=()=>{const mod=$('#sm').value;if(!mod)return;const r=Math.max(0,parseInt($('#tr').value)||0),l=Math.max(0,parseInt($('#tl').value)||0);
 SET=SET.filter(x=>x.m!==mod).concat([{m:mod,r,l}]);FB.put('settings','modules',{list:SET});track();stats()};
function dl(n,x,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([x],{type:m}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
$('#csv').onclick=()=>dl('attendance-'+$('#sm').value+'.csv','\ufeffالطالب,المجموعة,حضر,من,نسبة\n'+(window._rows||[]).map(r=>[`"${r.s.n}"`,r.s.g,r.att,r.tot,r.blk?'محجوب':(r.p===null?'':r.p)].join(',')).join('\n'),'text/csv');
$('#bx').onclick=()=>dl('attendance-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({sessions:allSessions(),extra:Object.values(R.extra)}),'application/json');
$('#ri').onclick=()=>$('#rf').click();
$('#rf').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());let n=0;Object.entries(j).forEach(([g,a])=>{FB.put('roster',g,{students:a.map(s=>Object.assign({i:s[0],n:s[1]},s[2]?{b:1}:{}))});n+=a.length});alert('تم رفع قائمة '+n+' طالب')}catch(x){alert('الملف غير صالح')}e.target.value=''};
$('#bi').onclick=()=>$('#bf').click();
$('#bf').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());let n=0;Object.values(j.sessions||{}).forEach(s=>{const o=allSessions()[s.id];if(!o||(s.at||0)>(o.at||0)){FB.put('sessions',s.id,s);n++}});(j.extra||[]).forEach(s=>{if(!R.extra[s.id])FB.put('students',s.id,s)});alert('تم استيراد '+n+' تحضير')}catch(x){alert('الملف غير صالح')}e.target.value=''};
function dayData(d){d=d||$('#dd').value;const S=Object.values(allSessions()).filter(s=>s.date===d),all=allStudents(),att={},own={};
 S.forEach(s=>{own[s.group]=1;Object.entries(s.marks).forEach(([i,v])=>{if(v!=='A')(att[i]=att[i]||[]).push(s)})});
 return{att,rows:groups.map(g=>{const ss=all.filter(x=>x.g===g&&!x.b),pr=ss.filter(x=>att[x.id]),ab=ss.filter(x=>!att[x.id]);return{g,ss,pr,ab,rec:!!own[g]||pr.length>0}})}}
function dayView(){const D=dayData(),att=D.att;let rec=0,p=0,a=0;
 $('#dl').innerHTML=D.rows.map(x=>{if(!x.rec)return`<div class="card"><b>${esc(x.g)}</b> <span class="tag">لم يُسجَّل غياب</span></div>`;rec++;p+=x.pr.length;a+=x.ab.length;
  return`<div class="card"><b>${esc(x.g)}</b> — حضر ${x.pr.length} من ${x.ss.length}`+
   (x.pr.length?`<details><summary>الحاضرون (${x.pr.length})</summary>${x.pr.map(s=>`<div>${esc(s.n)} <small class="tag">${att[s.id].map(z=>(z.group===x.g?'':'مع '+esc(z.group)+' · ')+esc(z.module)+' '+esc(z.type)).join(' + ')}</small></div>`).join('')}</details>`:'')+
   (x.ab.length?`<details><summary>لم يحضروا (${x.ab.length})</summary>${x.ab.map(s=>`<div>${esc(s.n)}</div>`).join('')}</details>`:'')+'</div>'}).join('');
 $('#dsum').textContent=`مسجّل ${rec} من ${groups.length} مجموعة · حضر ${p} · لم يحضر ${a}`;
 $('#dsync').textContent=lastPull?'آخر تحديث: '+new Date(lastPull).toLocaleTimeString('ar-EG')+(navigator.onLine?'':' (أوفلاين)'):'بانتظار البيانات'}
$('#dd').value=today();$('#dd').onchange=dayView;
$('#dcsv').onclick=()=>{const d1=$('#dd').value,d2=$('#dd2').value||d1,f=$('#dflt').value,q=s=>'"'+String(s).replace(/"/g,'""')+'"';
 if(!d1)return alert('اختار التاريخ');if(d2<d1)return alert('تاريخ النهاية قبل تاريخ البداية');
 const days=[];for(let x=new Date(d1+'T00:00:00Z');x<=new Date(d2+'T00:00:00Z')&&days.length<=200;x=new Date(x.getTime()+864e5))days.push(x.toISOString().slice(0,10));
 if(days.length>200)return alert('الفترة أطول من 200 يوم');
 const byG={};
 days.forEach(d=>{const D=dayData(d);D.rows.filter(x=>x.rec).forEach(x=>x.ss.forEach(s=>{const a=D.att[s.id],R=byG[x.g]=byG[x.g]||[];
  if(a){if(f!=='a')a.forEach(z=>R.push([d,x.g,s.id,q(s.n),'حضر',z.group,z.module,z.type,q(z.doctor)].join(',')))}
  else if(f!=='p')R.push([d,x.g,s.id,q(s.n),'لم يحضر','','','',''].join(','))}))});
 const out=groups.flatMap(g=>byG[g]||[]);
 if(!out.length)return alert('لا توجد بيانات لهذه الفترة بهذا الاختيار');
 dl((d1===d2?'daily-'+d1:'attendance-'+d1+'_'+d2)+(f==='p'?'-present':f==='a'?'-absent':'')+'.csv','\ufeffالتاريخ,مجموعته,الكود,الطالب,الحالة,حضر مع,الموديول,النوع,الدكتور\n'+out.join('\n'),'text/csv')};
function tab(t){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));['take','log','stats','day'].forEach(x=>$('#'+x).classList.toggle('hide',x!==t));if(t==='log')logView();if(t==='day')dayView();if(t==='stats'){fillMods();cfgFill();stats()}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
let admin=false,unsub=[];
function status(){const n=Object.keys(R.pending).filter(k=>R.pending[k]).length;$('#sync').textContent=(navigator.onLine?'متصل':'أوفلاين')+(admin?(n?' · '+n+' لم يُرفع':' · الكل مرفوع'):(L.pend?' · في انتظار الرفع':' · الكل مرفوع'))}
function sync(){status()}
function track(){L.pend=true;persist();status();FB.synced().then(()=>{L.pend=false;persist();status()})}
function dayRefresh(){fillMods();render();if(admin){if(!$('#day').classList.contains('hide'))dayView();if(!$('#log').classList.contains('hide'))logView()}status()}
function applyRole(a){admin=a;$('nav').classList.toggle('hide',!a);if(!a)tab('take');unsub.forEach(f=>f&&f());unsub=[];
 if(a)unsub.push(FB.watch('sessions',(m,p)=>{R.sessions=m;R.pending=p;lastPull=Date.now();dayRefresh()}));
 if(a)unsub.push(FB.watch('settings',m=>{SET=((m.modules||{}).list)||[];fillMods();cfgFill();if(!$('#stats').classList.contains('hide'))stats()}));
 unsub.push(FB.watch('students',m=>{R.extra=m;dayRefresh()}));
 unsub.push(FB.watch('roster',m=>{RO=m;ST=[];Object.entries(m).forEach(([g,d])=>(d.students||[]).forEach(s=>ST.push(Array.isArray(s)?[g,s[0],s[1]]:[g,s.i,s.n,s.b,s.f])));dayRefresh()}));status()}
FB.onUser(async u=>{$('#login').classList.toggle('hide',!!u);unsub.forEach(f=>f&&f());unsub=[];
 if(!u){R.sessions={};R.extra={};R.pending={};ST=[];RO={};admin=false;return}
 const k='role_'+u.uid;let a=null;try{a=localStorage.getItem(k)}catch(e){}
 applyRole(a==='1');const r=await FB.probe();
 if(r!==null){try{localStorage.setItem(k,r?'1':'0')}catch(e){}if(r!==(a==='1'))applyRole(r)}
 if(L.pend)track()});
$('#lgo').onclick=async()=>{$('#lerr').textContent='';try{await FB.login($('#le').value.trim(),$('#lp').value)}catch(e){$('#lerr').textContent=navigator.onLine?'الإيميل أو كلمة المرور غير صحيحة':'محتاج إنترنت لأول دخول'}};
$('#lout').onclick=()=>{if(confirm('تسجيل الخروج؟'))FB.logout()};
window.addEventListener('offline',status);
window.addEventListener('online',sync);if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
const BUILD='2026-10-27a';$('#ver').textContent='v'+BUILD;
async function goUpd(){try{if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(x=>caches.delete(x)))}}catch(e){}location.reload()}
function updBan(){if($('#upd'))return;const d=document.createElement('div');d.id='upd';d.style.cssText='position:fixed;bottom:0;left:0;right:0;background:var(--pri);color:var(--priInk);padding:14px;text-align:center;z-index:40;font-weight:700';d.textContent='في نسخة جديدة من البرنامج - احفظ شغلك واضغط هنا للتحديث';d.onclick=goUpd;document.body.appendChild(d)}
let updBusy=false;
async function chkUpd(){if(updBusy||!navigator.onLine)return;updBusy=true;try{const t=await(await fetch('index.html',{cache:'no-store'})).text();const m=t.match(/BUILD='(\d[^']*)'/);
 if(m&&m[1]!==BUILD){const busy=cur&&(cur.orig||Object.keys(cur.marks).length);
  if(busy)updBan();else{let last=0;try{last=+sessionStorage.getItem('att_rl')||0}catch(e){}
   if(Date.now()-last>60000){try{sessionStorage.setItem('att_rl',String(Date.now()))}catch(e){}await goUpd();return}else updBan()}}}catch(e){}updBusy=false}
setTimeout(chkUpd,2500);setInterval(chkUpd,300000);window.addEventListener('online',chkUpd);document.addEventListener('visibilitychange',()=>{if(!document.hidden)chkUpd()});
fillMods();render();status();mineView();setInterval(mineView,60000);
</script></body></html>
